<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼人杀 · 在线版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="moon" aria-hidden="true"></div>

  <main class="hero">
    <section id="homeView" class="view">
      <p class="brand">WEREWOLF ONLINE</p>
      <h1>狼人杀</h1>
      <p class="tagline">约上朋友，开一局。</p>

      <section class="panel">
        <label class="field">
          <span>你的昵称</span>
          <input id="playerName" maxlength="12" placeholder="例如：夜行客" autocomplete="off">
        </label>

        <button id="createRoom" class="btn primary" type="button">创建房间</button>

        <div class="divider"><span>或</span></div>

        <form id="joinForm" class="join">
          <input id="roomCode" maxlength="6" inputmode="numeric" placeholder="输入 6 位房间码"
                 autocomplete="off" aria-label="房间码">
          <button class="btn" type="submit">加入</button>
        </form>
      </section>

      <p id="status" class="status">连接服务器中…</p>
    </section>

    <section id="roomView" class="view" hidden>
      <p class="brand">ROOM</p>

      <div class="room-code">
        <span id="roomCodeLabel">------</span>
        <button id="copyCode" class="btn small" type="button">复制房间码</button>
      </div>

      <section class="panel">
        <h2 class="panel-title">玩家 <span id="playerCount">0</span> / 12</h2>
        <ul id="playerList" class="players"></ul>
      </section>

      <p id="connStatus" class="status">连接中…</p>
      <button id="leaveRoom" class="btn ghost" type="button">离开房间</button>
    </section>
  </main>

  <footer class="foot">v0.2 · 阶段 2：在线房间</footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
