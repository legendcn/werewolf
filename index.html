<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼人杀 · 在线版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="moon" aria-hidden="true"></div>

  <main class="hero">
    <p class="brand">WEREWOLF ONLINE</p>
    <h1>狼人杀</h1>
    <p class="tagline">约上朋友，开一局。</p>

    <section class="panel">
      <button id="createRoom" class="btn primary" type="button">创建房间</button>

      <div class="divider"><span>或</span></div>

      <form id="joinForm" class="join">
        <input id="roomCode" maxlength="6" inputmode="numeric" placeholder="输入 6 位房间码"
               autocomplete="off" aria-label="房间码">
        <button class="btn" type="submit">加入</button>
      </form>
    </section>

    <p id="status" class="status">本地预览模式 · 尚未连接服务器</p>
  </main>

  <footer class="foot">v0.1 · 阶段 1：界面骨架</footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
